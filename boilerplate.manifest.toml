# boilerplate.manifest.toml — ai-product-workflow `/product-init` 적용 계약
#
# 이 보일러플레이트를 제품 저장소에 적용할 때 "무엇을 복사하고, 무엇을 치환하고, 어떻게 검증하는지"를 정의합니다.
# 스키마/검증 규칙: ai-product-workflow/skills/product-init/reference/manifest-schema.md
# 이 파일 자체, `.env`, `.env.*`(*.example 제외)는 엔진 규칙에 따라 항상 복사되지 않습니다.

schema_version = 1
name = "fullstack-boilerplate"
version = "1.0.0"              # 이 manifest를 포함한 커밋에 붙일 Git 태그(v1.0.0)와 같아야 합니다

[apply]
exclude = []

# 프로젝트 이름 치환: 아래 파일에서만 정확한 문자열을 바꿉니다.
# README.md / CLAUDE.md 의 "fullstack-boilerplate"는 출처(보일러플레이트)를 가리키므로 치환하지 않습니다.
# backend/pyproject.toml 은 description 만 해당합니다 (패키지명 "backend"는 그대로라 uv.lock 과 무관).
[[substitutions]]
from = "fullstack-boilerplate"
to = "{project_slug}"
files = [
  ".env.example",
  "backend/.env.example",
  "docker-compose.yml",
  "backend/app/core/config.py",
  "backend/pyproject.toml",
]

[[substitutions]]
from = "Fullstack Boilerplate"
to = "{project_title}"
files = ["frontend/index.html", "frontend/src/pages/HomePage.tsx"]

# 제품 저장소에 같은 파일이 이미 있을 때, 사용자가 승인하면 적용할 병합 전략.
[[merge]]
path = ".gitignore"
strategy = "append-missing-lines"
required = [
  ".env",
  ".env.*",
  "!.env.example",
  "node_modules/",
  "dist/",
  ".venv/",
  "__pycache__/",
  ".pytest_cache/",
  ".ruff_cache/",
  ".mypy_cache/",
]

[[merge]]
path = "CLAUDE.md"
strategy = "append-section"
section_title = "개발 규칙 (fullstack-boilerplate)"

[[merge]]
path = "README.md"
strategy = "append-section"
section_title = "개발 환경 (fullstack-boilerplate)"

[verify]
env_file = ".env.example"      # docker-compose.yml 변수 파일. .env 를 만들지 않고 검증합니다.
# fe/be/db 검증이 만드는 산출물. Git에서 무시되지 않으면 검증을 시작하지 않습니다.
ignored_paths = [
  "frontend/node_modules",
  "frontend/dist",
  "backend/.venv",
  "backend/.pytest_cache",
  "backend/.ruff_cache",
  "backend/.mypy_cache",
]

# 검증 전용 호스트 포트. docker-compose.yml 의 POSTGRES_PORT / BACKEND_PORT / FRONTEND_PORT 로 주입됩니다.
# (기본 5432/8000/5173 을 쓰는 다른 프로젝트와 겹치지 않게 합니다. db 포트는 127.0.0.1 에만 바인딩됩니다.)
[verify.ports]
POSTGRES_PORT = 55432
BACKEND_PORT = 58000
FRONTEND_PORT = 55173

# 포트 변경에 맞춰 함께 바꿔야 하는 값 (.env.example 주석 참고)
[verify.env]
APP_ENV = "verify"
CORS_ORIGINS = "http://localhost:55173"
VITE_API_BASE_URL = "http://localhost:58000"

# 명령은 Makefile / .github/workflows/ci.yml 과 동일합니다.
#   fe    = make lint-fe typecheck-fe test-fe build (+ frozen install)
#   be    = make lint-be typecheck-be test-be      (+ frozen sync)
#   db    = make migrate + CI의 alembic check + 왕복(downgrade/upgrade) + make test-db
#   smoke = make up 과 같은 전체 기동 후 HTTP 확인
# {compose} = `docker compose -p <slug>-init-verify --env-file .env.example`
[verify.stages]
fe = [
  { run = "pnpm install --frozen-lockfile", cwd = "frontend" },
  { run = "pnpm lint", cwd = "frontend" },
  { run = "pnpm typecheck", cwd = "frontend" },
  { run = "pnpm test", cwd = "frontend" },
  { run = "pnpm build", cwd = "frontend" },
]
be = [
  { run = "uv sync --frozen", cwd = "backend" },
  { run = "uv run ruff check .", cwd = "backend" },
  { run = "uv run ruff format --check .", cwd = "backend" },
  { run = "uv run mypy app tests", cwd = "backend" },
  { run = "uv run pytest", cwd = "backend" },
]
db = [
  { run = "{compose} up -d --wait db" },
  { run = "{compose} run --rm --build backend alembic upgrade head" },
  { run = "{compose} run --rm backend alembic check" },
  { run = "{compose} run --rm backend alembic downgrade base" },
  { run = "{compose} run --rm backend alembic upgrade head" },
  { run = "{compose} run --rm backend pytest -m db" },
]
smoke = [
  { run = "{compose} up -d --build --wait" },
]

# smoke 단계 HTTP 확인 (엔진이 재시도)
[[verify.http]]
url = "http://localhost:{BACKEND_PORT}/health"
expect_status = 200
contains = "\"database\":\"ok\""

[[verify.http]]
url = "http://localhost:{FRONTEND_PORT}/"
expect_status = 200
